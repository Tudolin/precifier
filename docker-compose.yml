# =====================================================================
# MODO DESENVOLVIMENTO (o que voce usa para testar no Windows)
#
#   docker compose up --build
#   Abra http://localhost:3000
#
# Sobe tres containers:
#   redis  -> o banco de dados de verdade
#   kv     -> proxy HTTP que imita a API do Vercel KV (Upstash)
#   app    -> o site Next.js, com recarregamento automatico
#
# O @vercel/kv conversa por HTTP (nao pelo protocolo Redis puro), por isso
# o proxy "kv" e necessario: assim o codigo que roda aqui e EXATAMENTE o
# mesmo que vai rodar na Vercel, sem nenhum "if" de ambiente.
# =====================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: precifier-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kv:
    image: hiett/serverless-redis-http:latest
    container_name: precifier-kv
    environment:
      SRH_MODE: env
      SRH_TOKEN: token-local-de-teste
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      # Opcional: permite inspecionar o KV pelo navegador em http://localhost:8079
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy

  app:
    build:
      context: .
      target: dev
    container_name: precifier-app
    ports:
      # Se a porta 3000 ja estiver ocupada, crie um arquivo .env com PORTA=3001
      - "${PORTA:-3000}:3000"
    environment:
      # --- Banco (aponta para o proxy "kv" da rede interna) ---
      KV_REST_API_URL: http://kv:80
      KV_REST_API_TOKEN: token-local-de-teste

      # --- Login ---
      NEXTAUTH_URL: http://localhost:${PORTA:-3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-chave-de-teste-local-trocar-em-producao-1234567890}
      USER_EMAIL: ${USER_EMAIL:-dono@minhamassa.com.br}
      USER_PASSWORD: ${USER_PASSWORD:-massa123}

      # --- Necessario no Windows para o Next perceber que voce salvou um arquivo ---
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Seu codigo entra no container: editou no VS Code, recarrega sozinho
      - .:/app
      # Estas duas pastas ficam SO dentro do container (nao misturam com o Windows)
      - /app/node_modules
      - /app/.next
    depends_on:
      - kv

volumes:
  redis-dados:
